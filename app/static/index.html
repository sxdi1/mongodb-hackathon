
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SplitSmart | Messages</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="messages-app">

    <aside class="sidebar">
      <div class="sidebar-top">
        <h1>Messages</h1>
        <button class="compose-button" aria-label="New message">＋</button>
      </div>

      <div class="search-container">
        <input type="text" placeholder="Search" aria-label="Search conversations" />
      </div>

      <div class="conversation active">
        <div class="avatar-stack">
          <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Alex" />
          <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Sara" />
          <img src="https://randomuser.me/api/portraits/men/75.jpg" alt="Dev" />
        </div>
        <div class="conversation-info">
          <div class="conversation-heading">
            <strong>Montreal weekend</strong>
            <span>Now</span>
          </div>
          <p>Group conversation</p>
        </div>
      </div>
    </aside>

    <section class="chat-panel">
      <header class="chat-header">
        <div class="header-group">
          <div class="header-avatar-stack">
            <img src="https://randomuser.me/api/portraits/men/32.jpg" alt="Alex" />
            <img src="https://randomuser.me/api/portraits/women/44.jpg" alt="Sara" />
            <img src="https://randomuser.me/api/portraits/men/75.jpg" alt="Dev" />
          </div>
          <div>
            <h2>Montreal weekend</h2>
            <p id="participants">Alex, Sara, Dev</p>
          </div>
        </div>
        <button class="info-button" aria-label="Conversation information">ⓘ</button>
      </header>

      <div id="message-log" class="message-log">
        <div class="loading-message">Loading conversation...</div>
      </div>

      <div id="notice" class="notice" aria-live="polite"></div>

      <form id="chat-form" class="composer">
        <button type="button" class="attachment-button" aria-label="Attachments">＋</button>
        <textarea
          id="message-input"
          placeholder="iMessage"
          rows="1"
          aria-label="Write a message"
        ></textarea>
        <button type="submit" class="send-button" aria-label="Send message">
          ↑
        </button>
      </form>
    </section>

  </main>

  <script src="/app.js"></script>
</body>
</html>
