<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f7f7f9" />
  <title>SplitSmart Group Chat</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <main class="messages-window">
    <section class="chat-panel" aria-label="Group chat">
      <header class="chat-toolbar">
        <div class="chat-toolbar-row">
          <div id="group-participants" class="group-participants" aria-label="People in this chat"></div>
          <button
            id="group-info-button"
            class="group-info-button"
            type="button"
            aria-label="Show group chat information"
            aria-expanded="false"
            aria-controls="group-info"
          >i</button>
        </div>
        <div id="chat-title" class="chat-group-title">Montreal weekend</div>
        <div id="group-info" class="group-info" hidden>
          <div class="group-info-heading">People in this chat</div>
          <div id="group-info-members" class="group-info-members"></div>
          <label id="demo-member-switch" class="demo-member-switch" hidden>
            Send as
            <select id="demo-member-select" aria-label="Send messages as"></select>
          </label>
        </div>
      </header>

      <div id="message-log" class="message-log" aria-label="Group messages" aria-live="polite">
        <div class="loading-message">Loading conversation…</div>
      </div>

      <div id="notice" class="notice" role="status" aria-live="polite"></div>

      <form id="chat-form" class="composer">
        <div class="composer-plus" aria-hidden="true">+</div>
        <div class="composer-field">
          <textarea id="message-input" rows="1" placeholder="iMessage" aria-label="Message"></textarea>
        </div>
        <button class="send-button" type="submit" aria-label="Send message" disabled>↑</button>
      </form>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
